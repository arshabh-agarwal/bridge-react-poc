<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HostEmberWebpack</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}

    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/vendor.css">
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/host-ember-webpack.css">

    {{content-for "head-footer"}}

    <script>
      // Dev-only shim. The React remotes are served by `vite dev`, whose React Fast Refresh
      // transform assumes the host page ran @vitejs/plugin-react's preamble. A Vite host injects
      // it automatically; a non-Vite host has to provide these globals itself. Not needed when
      // the remotes are served from a production build.
      window.__vite_plugin_react_preamble_installed__ = true;
      window.$RefreshReg$ = window.$RefreshReg$ || function () {};
      window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type; }; };
    </script>
  </head>
  <body>
    {{content-for "body"}}

    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/host-ember-webpack.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
